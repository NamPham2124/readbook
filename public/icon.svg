<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stopColor="#1e1e2e"/>
      <stop offset="0.5" stopColor="#313244"/>
      <stop offset="1" stopColor="#181825"/>
    </linearGradient>
    <linearGradient id="pageL" x1="10" y1="13" x2="24" y2="34" gradientUnits="userSpaceOnUse">
      <stop stopColor="#89b4fa"/>
      <stop offset="1" stopColor="#b4befe" stopOpacity="0.6"/>
    </linearGradient>
    <linearGradient id="pageR" x1="38" y1="13" x2="24" y2="34" gradientUnits="userSpaceOnUse">
      <stop stopColor="#cba6f7"/>
      <stop offset="1" stopColor="#f5c2e7" stopOpacity="0.6"/>
    </linearGradient>
    <linearGradient id="spine" x1="24" y1="13" x2="24" y2="36" gradientUnits="userSpaceOnUse">
      <stop stopColor="#94e2d5"/>
      <stop offset="1" stopColor="#89b4fa"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="24" y1="11" x2="29" y2="21" gradientUnits="userSpaceOnUse">
      <stop stopColor="#f9e2af"/>
      <stop offset="1" stopColor="#fab387"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="48" height="48" rx="12" fill="url(#bg)"/>
  <rect x="1" y="1" width="46" height="46" rx="11" stroke="#89b4fa" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Left Page -->
  <path d="M24 15C20.5 13 14 13 11 14.5C10 15 10 16.5 10 33C14 31.5 20.5 32 24 34.5" fill="url(#pageL)" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Right Page -->
  <path d="M24 15C27.5 13 34 13 37 14.5C38 15 38 16.5 38 33C34 31.5 27.5 32 24 34.5" fill="url(#pageR)" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Book Spine -->
  <path d="M24 13V36" stroke="url(#spine)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Ribbon -->
  <path d="M24 11V21L26.5 19L29 21V12.5" fill="url(#ribbon)" stroke="#f9e2af" stroke-width="1" stroke-linejoin="round"/>

  <!-- Knowledge Star -->
  <circle cx="35" cy="13" r="2.5" fill="#94e2d5"/>
</svg>
